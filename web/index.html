  <style>
    /* Boot splash. Pixel-matched to the Flutter BrandSplash widget
       (lib/core/widgets/brand_splash.dart) and the native launch screens:
       cream background, 72px "g" mark dead-centre, wordmark + gold
       progress bar below. Flutter's first frame draws the same thing in
       the same place, so the fade-out is invisible rather than a flash. */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #FAFAF7;
      overscroll-behavior: none;
    }
    #gz-splash {
      position: fixed;
      inset: 0;
      background: #FAFAF7;
      z-index: 9999;
      transition: opacity .35s ease;
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #gz-splash.hidden { opacity: 0; pointer-events: none; }
    #gz-mark {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 72px;
      height: 72px;
      margin: -36px 0 0 -36px;
      animation: gz-in .5s ease-out both;
    }
    #gz-text {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(50% + 56px);
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: gz-in .5s .1s ease-out both;
    }
    #gz-word {
      color: #3C5152;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.3px;
      line-height: 29px;
    }
    #gz-sub {
      color: #6B7280;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 2.2px;
      margin-top: 4px;
    }
    #gz-bar {
      position: relative;
      overflow: hidden;
      width: 120px;
      height: 3px;
      border-radius: 2px;
      background: #E1DFC6;
      margin-top: 28px;
    }
    #gz-bar::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      width: 44px;
      border-radius: 2px;
      background: #D4AF37;
      animation: gz-slide 1.4s ease-in-out infinite;
    }
    #gz-foot {
      position: absolute;
      left: 0;
      right: 0;
      bottom: calc(28px + env(safe-area-inset-bottom, 0px));
      text-align: center;
      color: #6B7280;
      font-size: 11px;
      font-weight: 500;
    }
    #gz-error {
      display: none;
      margin-top: 22px;
      color: #6B7280;
      font-size: 13px;
      text-align: center;
      line-height: 1.5;
    }
    #gz-error button {
      margin-top: 10px;
      border: 0;
      border-radius: 10px;
      padding: 10px 18px;
      background: #3C5152;
      color: #FAFAF7;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    #gz-splash.failed #gz-bar { display: none; }
    #gz-splash.failed #gz-error { display: block; }
    @keyframes gz-slide {
      0%   { left: -44px; }
      100% { left: 120px; }
    }
    @keyframes gz-in {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      #gz-mark, #gz-text { animation: none; }
      #gz-bar::after { animation-duration: 3s; }
    }
  </style>
</head>
