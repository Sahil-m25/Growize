<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Growize — ARL Investor Portal. Private investor portal for Agri Research Labs agricultural projects.">
  <meta name="theme-color" content="#3C5152">

  <!-- Mobile-first viewport — covers notches and rounded corners -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- PWA / home-screen install -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Growize">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Private portal — discourage crawlers -->
  <meta name="robots" content="noindex, nofollow, noarchive">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Growize — ARL Investor Portal</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Splash screen shown while Flutter engine boots.
       Matches the app's primary colour so there's no flash of white. */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #3C5152;
      /* Prevent pull-to-refresh and over-scroll bounce on mobile */
      overscroll-behavior: none;
    }

    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #3C5152;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }

    #splash.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* Wordmark */
    #splash-title {
      color: #FAFAF7;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-top: 20px;
    }

    #splash-sub {
      color: #D4AF37;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 6px;
      opacity: 0.85;
    }

    /* Subtle animated dot loader */
    .dots {
      display: flex;
      gap: 6px;
      margin-top: 48px;
    }
    .dots span {
      width: 7px;
      height: 7px;
      background: rgba(255,255,255,0.35);
      border-radius: 50%;
      animation: pulse 1.2s ease-in-out infinite;
    }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
      0%, 80%, 100% { transform: scale(1);   opacity: 0.35; }
      40%            { transform: scale(1.3); opacity: 1;    }
    }
  </style>
</head>
<body>
  <!-- Splash: visible until Flutter signals it is ready -->
  <div id="splash">
    <!-- Logo placeholder — replaced by the real SVG/PNG once assets load -->
    <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="64" height="64" rx="16" fill="#2E7D6E"/>
      <path d="M32 14C22.06 14 14 22.06 14 32C14 41.94 22.06 50 32 50C41.94 50 50 41.94 50 32C50 22.06 41.94 14 32 14ZM32 20C36.42 20 40.36 21.84 43.18 24.82L24.82 43.18C21.84 40.36 20 36.42 20 32C20 25.37 25.37 20 32 20ZM32 44C27.58 44 23.64 42.16 20.82 39.18L39.18 20.82C42.16 23.64 44 27.58 44 32C44 38.63 38.63 44 32 44Z" fill="#D4AF37"/>
    </svg>
    <div id="splash-title">Growize</div>
    <div id="splash-sub">by ARL</div>
    <div class="dots">
      <span></span><span></span><span></span>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Hide the splash once Flutter has painted its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (splash) {
        splash.classList.add('hidden');
        // Remove from DOM after transition ends so it doesn't block touches.
        setTimeout(function () { splash.remove(); }, 450);
      }
    });
  </script>
</body>
</html>
