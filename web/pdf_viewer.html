<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Viewer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #FAFAF7; }
    #loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      color: #6B7280;
      gap: 10px;
    }
    #loading .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid #E1DFC6;
      border-top-color: #2E7D6E;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #error {
      display: none;
      align-items: center;
      justify-content: center;
      height: 100%;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      color: #C05640;
      text-align: center;
      padding: 24px;
    }
    #viewer {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      gap: 12px;
    }
    canvas {
      display: block;
      max-width: 100%;
      box-shadow: 0 1px 6px rgba(0,0,0,0.12);
      background: #fff;
    }
  </style>
</head>
<body>
  <div id="loading"><div class="spinner"></div>Loading document...</div>
  <div id="error"></div>
  <div id="viewer"></div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    function showError(msg) {
      document.getElementById('loading').style.display = 'none';
      var el = document.getElementById('error');
      el.textContent = msg;
      el.style.display = 'flex';
    }

    var params = new URLSearchParams(window.location.search);
    var rawUrl = params.get('url');

    if (!rawUrl) {
      showError('No document URL provided.');
    } else {
      var pdfUrl = decodeURIComponent(rawUrl);
      pdfjsLib.getDocument({ url: pdfUrl, withCredentials: false }).promise
        .then(function(pdf) {
          document.getElementById('loading').style.display = 'none';
          var viewer = document.getElementById('viewer');
          var total = pdf.numPages;
          var scale = Math.min((window.innerWidth - 32), 860) /
                      (window.innerWidth > 0 ? window.innerWidth : 860);

          function renderPage(num) {
            return pdf.getPage(num).then(function(page) {
              var baseViewport = page.getViewport({ scale: 1 });
              var fitScale = Math.min((window.innerWidth - 32), 860) / baseViewport.width;
              var viewport = page.getViewport({ scale: fitScale });
              var canvas = document.createElement('canvas');
              canvas.width = viewport.width;
              canvas.height = viewport.height;
              canvas.style.width = viewport.width + 'px';
              canvas.style.height = viewport.height + 'px';
              viewer.appendChild(canvas);
              return page.render({
                canvasContext: canvas.getContext('2d'),
                viewport: viewport
              }).promise;
            });
          }

          var chain = Promise.resolve();
          for (var i = 1; i <= total; i++) {
            (function(n) {
              chain = chain.then(function() { return renderPage(n); });
            })(i);
          }
          chain.catch(function(err) {
            showError('Error rendering document: ' + (err && err.message ? err.message : err));
          });
        })
        .catch(function(err) {
          showError('Could not load document. ' + (err && err.message ? err.message : String(err)));
        });
    }
  </script>
</body>
</html>
