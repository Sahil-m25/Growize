# Netlify deployment config for Growize Flutter web app
# Deploy: drag-and-drop build/web/ into netlify.com/drop, or use CLI

[build]
  publish = "build/web"
  command = "echo 'Build locally: .\\build_web.ps1'"

# Serve static legal pages directly (must come before the SPA catch-all)
[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

# SPA fallback — all other paths serve index.html (Flutter handles routing client-side)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Security & mobile headers (applied to every response) ───────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Allows Supabase API calls and Google Fonts / CDN assets Flutter may load
    Content-Security-Policy = "default-src 'self' https://*.supabase.co wss://*.supabase.co; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://o4511383323869184.ingest.de.sentry.io;"

# ── Caching strategy ────────────────────────────────────────────────────
# Flutter hashed assets (content-addressed, safe to cache forever)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.wasm"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# main.dart.js and flutter_bootstrap.js change every build but have no
# hash in their filename — must NOT be immutable or browsers serve stale code.
[[headers]]
  for = "/main.dart.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/flutter_bootstrap.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# index.html must never be cached — entry point Flutter checks for updates
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Service worker must revalidate on every load
[[headers]]
  for = "/flutter_service_worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
